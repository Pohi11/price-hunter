include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

# Mirrors the AWS setup: checks queue with a DLQ after 5 receives.
queues {
  pricehunter-checks {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "pricehunter-checks-dlq"
      maxReceiveCount = 5
    }
  }
  pricehunter-checks-dlq { }
}
